# Freya service-to-service policy for lcm: the gateway forwards browser traffic
# and probes health; auth verifies SVIDs/trust bundles; notification publishes
# lifecycle events; the scheduler runs lcm's scheduled tasks; the deployer and
# inventory (feature 033: relaying certificates to inventory agents) download
# issued certificates.
# (contracts/manifest.md, deploy/policy.yaml)
version: lcm-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["lcm"]
    operations: ["*"]
    effect: allow
  - id: auth-verify
    from: ["spiffe://example.org/svc/auth"]
    to: ["lcm"]
    operations: ["/lcm.v1.SVID/Verify", "/lcm.v1.SVID/GetTrustBundle"]
    effect: allow
  - id: modules-events
    from: ["spiffe://example.org/svc/notification", "spiffe://example.org/svc/warden"]
    to: ["lcm"]
    operations: ["/lcm.v1.Events/Publish"]
    effect: allow
  - id: workloads-renew
    from: ["spiffe://example.org/svc/*"]
    to: ["lcm"]
    operations: ["/lcm.v1.Enrollment/Enroll"]
    effect: allow
  - id: deployer-download
    from: ["spiffe://example.org/svc/deployer"]
    to: ["lcm"]
    operations: ["/lcm.v1.Certificates/Download"]
    effect: allow
  - id: inventory-download
    # inventory relays certificates to its agents (feature 033): it fetches
    # cert + chain (+ retained key) at the moment an agent pulls a delivery
    # the deployer created; nothing is persisted by inventory.
    from: ["spiffe://example.org/svc/inventory"]
    to: ["lcm"]
    operations: ["/lcm.v1.Certificates/Download"]
    effect: allow
  - id: scheduler-execute
    from: ["spiffe://example.org/svc/scheduler"]
    to: ["lcm"]
    operations: ["/scheduler.v1.TaskExecutor/ExecuteTask"]
    effect: allow
