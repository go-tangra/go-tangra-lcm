components:
    schemas:
        AccessibleCertificate:
            type: object
            properties:
                certificateId:
                    type: string
                ownerClientId:
                    type: string
                commonName:
                    type: string
                dnsNames:
                    type: array
                    items:
                        type: string
                issuerName:
                    type: string
                permissionType:
                    enum:
                        - PERMISSION_TYPE_UNSPECIFIED
                        - PERMISSION_TYPE_READ
                        - PERMISSION_TYPE_DOWNLOAD
                        - PERMISSION_TYPE_FULL
                    type: string
                    format: enum
                grantedBy:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                certificateExpiresAt:
                    type: string
                    format: date-time
                grantedAt:
                    type: string
                    format: date-time
            description: Certificate accessible via permission grant
        AcmeIssuer:
            type: object
            properties:
                email:
                    type: string
                endpoint:
                    type: string
                keyType:
                    type: string
                keySize:
                    type: integer
                    format: int32
                maxRetries:
                    type: integer
                    format: int32
                baseDelay:
                    type: string
                challengeType:
                    enum:
                        - HTTP
                        - DNS
                    type: string
                    format: enum
                providerName:
                    type: string
                providerConfig:
                    type: object
                    additionalProperties:
                        type: string
                eabKid:
                    type: string
                    description: External Account Binding (EAB) for ACME providers that require it (e.g., ZeroSSL, Google Trust Services)
                eabHmacKey:
                    type: string
        ApproveMtlsCertificateRequestRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                issuerName:
                    type: string
                validityDays:
                    type: integer
                    format: int32
                notes:
                    type: string
            description: Approve mTLS Certificate Request
        ApproveMtlsCertificateRequestResponse:
            type: object
            properties:
                request:
                    $ref: '#/components/schemas/MtlsCertificateRequest'
                certificate:
                    $ref: '#/components/schemas/ClientCertificate'
        AuditLog:
            type: object
            properties:
                id:
                    type: integer
                    description: Database ID
                    format: uint32
                auditId:
                    type: string
                    description: Unique audit log identifier (UUID)
                requestId:
                    type: string
                    description: Request ID from metadata
                tenantId:
                    type: integer
                    description: Tenant ID
                    format: uint32
                operation:
                    type: string
                    description: Operation info
                serviceName:
                    type: string
                clientId:
                    type: string
                    description: Client info (from mTLS)
                clientCommonName:
                    type: string
                clientOrganization:
                    type: string
                clientSerialNumber:
                    type: string
                isAuthenticated:
                    type: boolean
                success:
                    type: boolean
                    description: Request/Response
                errorCode:
                    type: integer
                    format: int32
                errorMessage:
                    type: string
                latencyMs:
                    type: string
                    description: Timing
                peerAddress:
                    type: string
                    description: Network info
                logHash:
                    type: string
                    description: Cryptographic integrity
                createdAt:
                    type: string
                    description: Timestamps
                    format: date-time
            description: AuditLog represents an audit log entry for LCM operations
        CertificateJobInfo:
            type: object
            properties:
                jobId:
                    type: string
                status:
                    enum:
                        - CERTIFICATE_JOB_STATUS_UNSPECIFIED
                        - CERTIFICATE_JOB_STATUS_PENDING
                        - CERTIFICATE_JOB_STATUS_PROCESSING
                        - CERTIFICATE_JOB_STATUS_COMPLETED
                        - CERTIFICATE_JOB_STATUS_FAILED
                        - CERTIFICATE_JOB_STATUS_CANCELLED
                    type: string
                    format: enum
                issuerName:
                    type: string
                issuerType:
                    type: string
                commonName:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                completedAt:
                    type: string
                    format: date-time
                errorMessage:
                    type: string
                clientId:
                    type: string
            description: Job summary info for listing
        CertificatePermission:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                certificateId:
                    type: string
                granteeClientId:
                    type: integer
                    format: uint32
                granteeClientName:
                    type: string
                permissionType:
                    enum:
                        - PERMISSION_TYPE_UNSPECIFIED
                        - PERMISSION_TYPE_READ
                        - PERMISSION_TYPE_DOWNLOAD
                        - PERMISSION_TYPE_FULL
                    type: string
                    format: enum
                grantedBy:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: CertificatePermission represents a permission grant
        CertificateStatistics:
            type: object
            properties:
                totalCount:
                    type: string
                    description: Total number of certificates
                activeCount:
                    type: string
                    description: Number of active certificates
                expiredCount:
                    type: string
                    description: Number of expired certificates
                revokedCount:
                    type: string
                    description: Number of revoked certificates
                suspendedCount:
                    type: string
                    description: Number of suspended certificates
                expireSoonCount:
                    type: string
                    description: Number of certificates expiring soon
                expireSoonDays:
                    type: integer
                    description: Days threshold used for expire soon calculation
                    format: int32
                wildcardCount:
                    type: string
                    description: Number of wildcard certificates
                byType:
                    allOf:
                        - $ref: '#/components/schemas/CertificateTypeBreakdown'
                    description: Certificates by type
                byIssuer:
                    type: array
                    items:
                        $ref: '#/components/schemas/IssuerCertificateCount'
                    description: Certificates grouped by issuer
            description: CertificateStatistics contains statistics about certificates
        CertificateTypeBreakdown:
            type: object
            properties:
                clientCerts:
                    type: string
                    description: Number of client certificates
                internalCerts:
                    type: string
                    description: Number of internal certificates
                caCerts:
                    type: string
                    description: Number of CA certificates
            description: CertificateTypeBreakdown provides certificate counts by type
        CheckPermissionResponse:
            type: object
            properties:
                hasPermission:
                    type: boolean
                isOwner:
                    type: boolean
                    description: True if the caller owns the certificate (not via grant)
                grantedPermission:
                    enum:
                        - PERMISSION_TYPE_UNSPECIFIED
                        - PERMISSION_TYPE_READ
                        - PERMISSION_TYPE_DOWNLOAD
                        - PERMISSION_TYPE_FULL
                    type: string
                    description: The actual permission level if granted (may be higher than required)
                    format: enum
            description: Response for permission check
        ClientCertificate:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                commonName:
                    type: string
                requestId:
                    type: string
                serialNumber:
                    type: string
                subject:
                    type: string
                issuerDn:
                    type: string
                fingerprint:
                    type: string
                certificatePem:
                    type: string
                notBefore:
                    type: string
                notAfter:
                    type: string
                status:
                    enum:
                        - CLIENT_CERT_STATUS_UNKNOWN
                        - CLIENT_CERT_STATUS_ISSUED
                        - CLIENT_CERT_STATUS_PENDING
                        - CLIENT_CERT_STATUS_REVOKED
                    type: string
                    format: enum
                metadata:
                    type: string
                lastSeen:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    format: date-time
                revokedBy:
                    type: string
                revokedReason:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                approvedBy:
                    type: string
                certType:
                    enum:
                        - MTLS_CERT_TYPE_UNSPECIFIED
                        - MTLS_CERT_TYPE_CLIENT
                        - MTLS_CERT_TYPE_INTERNAL
                    type: string
                    format: enum
                tenantId:
                    type: integer
                    format: uint32
                createBy:
                    type: integer
                    format: uint32
                updateBy:
                    type: integer
                    format: uint32
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                deleteTime:
                    type: string
                    format: date-time
            description: ClientCertificate is a simplified view of an mTLS certificate for client-facing APIs
        ClientStatistics:
            type: object
            properties:
                totalCount:
                    type: string
                    description: Total number of registered clients
                activeCount:
                    type: string
                    description: Number of active clients
                disabledCount:
                    type: string
                    description: Number of disabled clients
                suspendedCount:
                    type: string
                    description: Number of suspended clients
                byStatus:
                    type: object
                    additionalProperties:
                        type: string
                    description: Clients grouped by status
            description: ClientStatistics contains statistics about LCM clients
        CreateIssuerRequest:
            type: object
            properties:
                name:
                    type: string
                type:
                    type: string
                keyType:
                    type: string
                description:
                    type: string
                selfIssuer:
                    $ref: '#/components/schemas/SelfIssuer'
                acmeIssuer:
                    $ref: '#/components/schemas/AcmeIssuer'
                status:
                    enum:
                        - ISSUER_STATUS_UNSPECIFIED
                        - ISSUER_STATUS_ACTIVE
                        - ISSUER_STATUS_DISABLED
                        - ISSUER_STATUS_ERROR
                    type: string
                    format: enum
            description: Issuer creation and management messages
        CreateIssuerResponse:
            type: object
            properties:
                issuer:
                    $ref: '#/components/schemas/IssuerInfo'
        CreateMtlsCertificateRequestRequest:
            required:
                - clientId
                - commonName
            type: object
            properties:
                clientId:
                    type: string
                commonName:
                    type: string
                csrPem:
                    type: string
                publicKey:
                    type: string
                dnsNames:
                    type: array
                    items:
                        type: string
                ipAddresses:
                    type: array
                    items:
                        type: string
                issuerName:
                    type: string
                certType:
                    enum:
                        - MTLS_CERT_TYPE_UNSPECIFIED
                        - MTLS_CERT_TYPE_CLIENT
                        - MTLS_CERT_TYPE_INTERNAL
                    type: string
                    format: enum
                validityDays:
                    type: integer
                    format: int32
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                notes:
                    type: string
            description: Create mTLS Certificate Request
        CreateMtlsCertificateRequestResponse:
            type: object
            properties:
                mtlsCertificateRequest:
                    $ref: '#/components/schemas/MtlsCertificateRequest'
        CreateTenantSecretRequest:
            required:
                - tenantId
                - secret
            type: object
            properties:
                tenantId:
                    type: integer
                    format: uint32
                secret:
                    type: string
                description:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
            description: Create a new tenant secret
        CreateTenantSecretResponse:
            type: object
            properties:
                tenantSecret:
                    $ref: '#/components/schemas/TenantSecret'
        DeleteMtlsCertificateRequestResponse:
            type: object
            properties:
                mtlsCertificateRequest:
                    $ref: '#/components/schemas/MtlsCertificateRequest'
        DeleteMtlsCertificateResponse:
            type: object
            properties:
                mtlsCertificate:
                    $ref: '#/components/schemas/MtlsCertificate'
        DnsProviderInfo:
            type: object
            properties:
                name:
                    type: string
                description:
                    type: string
                requiredFields:
                    type: array
                    items:
                        type: string
                optionalFields:
                    type: array
                    items:
                        type: string
        DownloadMtlsCertificateResponse:
            type: object
            properties:
                certificatePem:
                    type: string
                chainPem:
                    type: string
                caCertificatePem:
                    type: string
        ForceRenewCertificateRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
            description: Request to force renew an issued certificate
        ForceRenewCertificateResponse:
            type: object
            properties:
                renewalId:
                    type: string
                message:
                    type: string
            description: Response for force renewing an issued certificate
        GetAuditLogByAuditIdResponse:
            type: object
            properties:
                auditLog:
                    $ref: '#/components/schemas/AuditLog'
        GetAuditLogResponse:
            type: object
            properties:
                auditLog:
                    $ref: '#/components/schemas/AuditLog'
        GetAuditStatsResponse:
            type: object
            properties:
                totalOperations:
                    type: string
                    description: Total number of operations
                successfulOperations:
                    type: string
                    description: Number of successful operations
                failedOperations:
                    type: string
                    description: Number of failed operations
                avgLatencyMs:
                    type: number
                    description: Average latency in milliseconds
                    format: double
                uniqueClients:
                    type: string
                    description: Unique clients count
                operationsByType:
                    type: object
                    additionalProperties:
                        type: string
                    description: Operations breakdown by operation type
        GetIssuedCertificateResponse:
            type: object
            properties:
                certificate:
                    $ref: '#/components/schemas/IssuedCertificateInfo'
                certificatePem:
                    type: string
                    description: Certificate PEM data (only present for issued certificates)
                caCertificatePem:
                    type: string
                privateKeyPem:
                    type: string
                    description: Private key PEM (only if include_private_key=true and server-generated)
                serverGeneratedKey:
                    type: boolean
            description: Response for getting a single issued certificate
        GetIssuerInfoResponse:
            type: object
            properties:
                issuer:
                    $ref: '#/components/schemas/IssuerInfo'
        GetJobResultResponse:
            type: object
            properties:
                jobId:
                    type: string
                status:
                    enum:
                        - CERTIFICATE_JOB_STATUS_UNSPECIFIED
                        - CERTIFICATE_JOB_STATUS_PENDING
                        - CERTIFICATE_JOB_STATUS_PROCESSING
                        - CERTIFICATE_JOB_STATUS_COMPLETED
                        - CERTIFICATE_JOB_STATUS_FAILED
                        - CERTIFICATE_JOB_STATUS_CANCELLED
                    type: string
                    format: enum
                certificatePem:
                    type: string
                    description: Certificate data (only present if job is completed)
                caCertificatePem:
                    type: string
                privateKeyPem:
                    type: string
                serialNumber:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                issuedAt:
                    type: string
                    format: date-time
                errorMessage:
                    type: string
                    description: Error info (only present if job failed)
                csrPem:
                    type: string
                    description: Certificate request data
                keyType:
                    type: string
                keySize:
                    type: integer
                    format: int32
                serverGeneratedKey:
                    type: boolean
            description: Job result response
        GetJobStatusResponse:
            type: object
            properties:
                jobId:
                    type: string
                status:
                    enum:
                        - CERTIFICATE_JOB_STATUS_UNSPECIFIED
                        - CERTIFICATE_JOB_STATUS_PENDING
                        - CERTIFICATE_JOB_STATUS_PROCESSING
                        - CERTIFICATE_JOB_STATUS_COMPLETED
                        - CERTIFICATE_JOB_STATUS_FAILED
                        - CERTIFICATE_JOB_STATUS_CANCELLED
                    type: string
                    format: enum
                issuerName:
                    type: string
                issuerType:
                    type: string
                commonName:
                    type: string
                dnsNames:
                    type: array
                    items:
                        type: string
                ipAddresses:
                    type: array
                    items:
                        type: string
                errorMessage:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                completedAt:
                    type: string
                    format: date-time
            description: Job status response
        GetMtlsCertificateRequestResponse:
            type: object
            properties:
                mtlsCertificateRequest:
                    $ref: '#/components/schemas/MtlsCertificateRequest'
        GetMtlsCertificateResponse:
            type: object
            properties:
                mtlsCertificate:
                    $ref: '#/components/schemas/MtlsCertificate'
        GetStatisticsResponse:
            type: object
            properties:
                certificates:
                    allOf:
                        - $ref: '#/components/schemas/CertificateStatistics'
                    description: 'Overall certificate statistics (DEPRECATED: use issued_certificates and mtls_certificates instead)'
                clients:
                    allOf:
                        - $ref: '#/components/schemas/ClientStatistics'
                    description: Client statistics
                issuers:
                    allOf:
                        - $ref: '#/components/schemas/IssuerStatistics'
                    description: Issuer statistics
                jobs:
                    allOf:
                        - $ref: '#/components/schemas/JobStatistics'
                    description: Certificate job statistics
                recentErrors:
                    type: array
                    items:
                        $ref: '#/components/schemas/RecentError'
                    description: Recent errors/failures
                tenantBreakdown:
                    type: array
                    items:
                        $ref: '#/components/schemas/TenantStatistics'
                    description: Per-tenant breakdown (only for platform admin requests)
                generatedAt:
                    type: string
                    description: Statistics generation timestamp
                    format: date-time
                issuedCertificates:
                    allOf:
                        - $ref: '#/components/schemas/IssuedCertificateStatistics'
                    description: Issued certificate statistics (certificates issued to clients - the main certificates)
                mtlsCertificates:
                    allOf:
                        - $ref: '#/components/schemas/MtlsCertificateStatistics'
                    description: MTLS certificate statistics (certificates used for mTLS authentication - internal use)
            description: GetStatisticsResponse is the response message for GetStatistics
        GetTenantSecretResponse:
            type: object
            properties:
                tenantSecret:
                    $ref: '#/components/schemas/TenantSecret'
        GrantPermissionRequest:
            required:
                - certificateId
                - granteeClientId
                - permissionType
            type: object
            properties:
                certificateId:
                    type: string
                    description: ID of the certificate to share
                granteeClientId:
                    type: string
                    description: Client ID of the grantee (the client receiving access)
                permissionType:
                    enum:
                        - PERMISSION_TYPE_UNSPECIFIED
                        - PERMISSION_TYPE_READ
                        - PERMISSION_TYPE_DOWNLOAD
                        - PERMISSION_TYPE_FULL
                    type: string
                    description: Type of permission to grant
                    format: enum
                expiresAt:
                    type: string
                    description: Optional expiration time for the permission
                    format: date-time
            description: Request to grant permission
        GrantPermissionResponse:
            type: object
            properties:
                permission:
                    $ref: '#/components/schemas/CertificatePermission'
            description: Response after granting permission
        HealthCheckResponse:
            type: object
            properties:
                status:
                    type: boolean
                message:
                    type: string
        IssueMtlsCertificateRequest:
            required:
                - clientId
                - commonName
            type: object
            properties:
                clientId:
                    type: string
                commonName:
                    type: string
                csrPem:
                    type: string
                publicKeyPem:
                    type: string
                dnsNames:
                    type: array
                    items:
                        type: string
                ipAddresses:
                    type: array
                    items:
                        type: string
                issuerName:
                    type: string
                certType:
                    enum:
                        - MTLS_CERT_TYPE_UNSPECIFIED
                        - MTLS_CERT_TYPE_CLIENT
                        - MTLS_CERT_TYPE_INTERNAL
                    type: string
                    format: enum
                validityDays:
                    type: integer
                    format: int32
                metadata:
                    type: object
                    additionalProperties:
                        type: string
