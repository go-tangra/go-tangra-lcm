# LCM Module Menu Definitions
# This file defines the menu structure for the LCM (Certificate Lifecycle Management) module
# Used by admin service for dynamic menu registration

module:
  id: lcm
  name: LCM
  description: Certificate Lifecycle Management

menus:
  - id: lcm
    parent_id: null
    type: CATALOG
    name: Certificate Manager
    path: /lcm
    icon: lucide:shield-check
    order: 400
    authority:
      - platform:admin
      - tenant:manager

  - id: lcm-certificates
    parent_id: lcm
    type: MENU
    name: Mtls Certificates
    path: certificate
    component: app/lcm/certificate/index.vue
    icon: lucide:file-check
    order: 1
    authority:
      - platform:admin
      - tenant:manager

  - id: lcm-issued-certificates
    parent_id: lcm
    type: MENU
    name: Issued Certificates
    path: issued-certificate
    component: app/lcm/issued-certificate/index.vue
    icon: lucide:award
    order: 2
    authority:
      - platform:admin
      - tenant:manager

  - id: lcm-jobs
    parent_id: lcm
    type: MENU
    name: Certificate Jobs
    path: certificate-job
    component: app/lcm/certificate-job/index.vue
    icon: lucide:list-todo
    order: 3
    authority:
      - platform:admin
      - tenant:manager

  - id: lcm-issuers
    parent_id: lcm
    type: MENU
    name: Issuers
    path: issuer
    component: app/lcm/issuer/index.vue
    icon: lucide:stamp
    order: 4
    authority:
      - platform:admin
      - tenant:manager

  - id: lcm-permissions
    parent_id: lcm
    type: MENU
    name: Permissions
    path: certificate-permission
    component: app/lcm/certificate-permission/index.vue
    icon: lucide:key
    order: 5
    authority:
      - platform:admin
      - tenant:manager

  - id: lcm-tenant-secrets
    parent_id: lcm
    type: MENU
    name: Tenant Secrets
    path: tenant-secret
    component: app/lcm/tenant-secret/index.vue
    icon: lucide:lock
    order: 6
    authority:
      - platform:admin
      - tenant:manager

dashboard_widgets:
  - id: lcm.issued_certs_total
    name: Issued Certificates
    description: Active and total issued certificate counts
    icon: lucide:award
    widget_type: stat_card
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      value_path: issuedCertificates.activeCount
      total_path: issuedCertificates.totalCount
      label: Certificates
    default_size:
      width: 3
      height: 1
    tags: [lcm, overview]
    authority: [platform:admin, tenant:manager]

  - id: lcm.expiring_soon
    name: Expiring Soon
    description: Certificates expiring within configured days
    icon: lucide:clock
    widget_type: stat_card
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      value_path: issuedCertificates.expireSoonCount
      total_path: issuedCertificates.expireSoonDays
      label: Expiring Soon
    default_size:
      width: 3
      height: 1
    tags: [lcm, overview]
    authority: [platform:admin, tenant:manager]

  - id: lcm.certificate_status_pie
    name: Certificate Status
    description: Pie chart of certificate statuses
    icon: lucide:pie-chart
    widget_type: pie_chart
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      series_path: issuedCertificates
      series_fields: activeCount,expiredCount,revokedCount,pendingCount,failedCount
      series_labels: Active,Expired,Revoked,Pending,Failed
    default_size:
      width: 4
      height: 2
    tags: [lcm, chart]
    authority: [platform:admin, tenant:manager]

  - id: lcm.recent_errors
    name: Recent Errors
    description: List of recent certificate job errors
    icon: lucide:alert-triangle
    widget_type: list
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      items_path: recentErrors
      title_field: errorMessage
      subtitle_field: commonName
      time_field: occurredAt
    default_size:
      width: 4
      height: 2
    tags: [lcm, errors]
    authority: [platform:admin, tenant:manager]

  - id: lcm.issuer_distribution
    name: Issuers by Type
    description: Pie chart of certificate issuers grouped by type
    icon: lucide:stamp
    widget_type: pie_chart
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      data_path: issuers.byType
      label: Issuer Type
    default_size:
      width: 4
      height: 2
    tags: [lcm, chart]
    authority: [platform:admin, tenant:manager]

  - id: lcm.cert_expiration_timeline
    name: Expiration Timeline
    description: Certificates expiring in the next 30/60/90 days
    icon: lucide:calendar-clock
    widget_type: bar_chart
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      data_path: issuedCertificates.byIssuerType
      label: By Issuer
    default_size:
      width: 4
      height: 2
    tags: [lcm, chart]
    authority: [platform:admin, tenant:manager]

  - id: lcm.job_status_pie
    name: Job Status
    description: Pie chart of certificate job statuses
    icon: lucide:pie-chart
    widget_type: pie_chart
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      series_path: jobs
      series_fields: completedCount,failedCount,pendingCount,processingCount,cancelledCount
      series_labels: Completed,Failed,Pending,Processing,Cancelled
    default_size:
      width: 4
      height: 2
    tags: [lcm, chart]
    authority: [platform:admin, tenant:manager]

  - id: lcm.auto_renew_stat
    name: Auto-Renew Enabled
    description: Certificates with auto-renewal enabled
    icon: lucide:refresh-cw
    widget_type: stat_card
    data_source:
      endpoint: /admin/v1/modules/lcm/v1/statistics
      method: GET
    data_mapping:
      value_path: issuedCertificates.autoRenewEnabledCount
      total_path: issuedCertificates.totalCount
      label: Auto-Renew
    default_size:
      width: 3
      height: 1
    tags: [lcm, overview]
    authority: [platform:admin, tenant:manager]

permission_groups:
  - name: LCM
    module: lcm
    description: LCM Certificate Management Permissions
    permissions:
      - name: View Certificates
        code: lcm.certificate.view
        description: View certificate details and list
      - name: Create Certificates
        code: lcm.certificate.create
        description: Create new certificate requests
      - name: Update Certificates
        code: lcm.certificate.update
        description: Update certificate configurations
      - name: Delete Certificates
        code: lcm.certificate.delete
        description: Delete certificates
      - name: Revoke Certificates
        code: lcm.certificate.revoke
        description: Revoke issued certificates
      - name: Manage Issuers
        code: lcm.issuer.manage
        description: Manage certificate issuers
      - name: Manage Jobs
        code: lcm.job.manage
        description: Manage certificate jobs
      - name: View Issued Certificates
        code: lcm.issued_certificate.view
        description: View issued certificates list and details

roles:
  - name: LCM Administrator
    code: lcm.admin
    description: Full access to LCM module - can manage certificates, issuers, and jobs
    is_system: true
    permissions:
      - lcm.certificate.view
      - lcm.certificate.create
      - lcm.certificate.update
      - lcm.certificate.delete
      - lcm.certificate.revoke
      - lcm.issuer.manage
      - lcm.job.manage
      - lcm.issued_certificate.view

  - name: LCM Operator
    code: lcm.operator
    description: Operational access to LCM module - can create and manage certificates
    is_system: true
    permissions:
      - lcm.certificate.view
      - lcm.certificate.create
      - lcm.certificate.update
      - lcm.job.manage
      - lcm.issued_certificate.view

  - name: LCM Viewer
    code: lcm.viewer
    description: Read-only access to LCM module
    is_system: true
    permissions:
      - lcm.certificate.view
      - lcm.issued_certificate.view
