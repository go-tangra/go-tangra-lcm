# Freya service-to-service policy for lcm: the gateway forwards browser traffic
# and probes health; auth verifies SVIDs/trust bundles; notification publishes
# lifecycle events. (contracts/manifest.md, deploy/policy.yaml)
version: lcm-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["lcm"]
    operations: ["*"]
    effect: allow
  - id: auth-verify
    from: ["spiffe://example.org/svc/auth"]
    to: ["lcm"]
    operations: ["/lcm.v1.SVID/Verify", "/lcm.v1.SVID/GetTrustBundle"]
    effect: allow
  - id: modules-events
    from: ["spiffe://example.org/svc/notification", "spiffe://example.org/svc/warden"]
    to: ["lcm"]
    operations: ["/lcm.v1.Events/Publish"]
    effect: allow
  - id: workloads-renew
    from: ["spiffe://example.org/svc/*"]
    to: ["lcm"]
    operations: ["/lcm.v1.Enrollment/Enroll"]
    effect: allow
  - id: deployer-download
    from: ["spiffe://example.org/svc/deployer"]
    to: ["lcm"]
    operations: ["/lcm.v1.Certificates/Download"]
    effect: allow
