syntax = "proto3";

package lcm.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "redact/v3/redact.proto";

// Issued Certificate Service - view and manage issued certificates
service LcmIssuedCertificateService {
  // List issued certificates with optional filters
  rpc ListIssuedCertificates(ListIssuedCertificatesRequest) returns (ListIssuedCertificatesResponse) {
    option (google.api.http) = {
      get: "/v1/issued-certificates"
    };
  }

  // Get a single issued certificate by ID
  rpc GetIssuedCertificate(GetIssuedCertificateRequest) returns (GetIssuedCertificateResponse) {
    option (google.api.http) = {
      get: "/v1/issued-certificates/{id}"
    };
  }

  // Update an issued certificate (e.g. auto-renew settings)
  rpc UpdateIssuedCertificate(UpdateIssuedCertificateRequest) returns (UpdateIssuedCertificateResponse) {
    option (google.api.http) = {
      patch: "/v1/issued-certificates/{id}"
      body: "*"
    };
  }

  // Force renew an issued certificate
  rpc ForceRenewCertificate(ForceRenewCertificateRequest) returns (ForceRenewCertificateResponse) {
    option (google.api.http) = {
      post: "/v1/issued-certificates/{id}/renew"
      body: "*"
    };
  }

  // Deploy a certificate via the deployer module
  rpc DeployCertificate(DeployCertificateRequest) returns (DeployCertificateResponse) {
    option (google.api.http) = {
      post: "/v1/issued-certificates/{id}/deploy"
      body: "*"
    };
  }

  // List available deployment targets from the deployer module
  rpc ListDeploymentTargets(ListDeploymentTargetsRequest) returns (ListDeploymentTargetsResponse) {
    option (google.api.http) = {
      get: "/v1/deployment-targets"
    };
  }
}

// Issued certificate status enumeration
enum IssuedCertificateStatus {
  ISSUED_CERTIFICATE_STATUS_UNSPECIFIED = 0;
  ISSUED_CERTIFICATE_STATUS_PENDING = 1;
  ISSUED_CERTIFICATE_STATUS_PROCESSING = 2;
  ISSUED_CERTIFICATE_STATUS_ISSUED = 3;
  ISSUED_CERTIFICATE_STATUS_EXPIRED = 4;
  ISSUED_CERTIFICATE_STATUS_REVOKED = 5;
  ISSUED_CERTIFICATE_STATUS_FAILED = 6;
  ISSUED_CERTIFICATE_STATUS_RENEWED = 7;
  // Derived at response time: certificate is still valid but expires within
  // the next 30 days. Never persisted to the database.
  ISSUED_CERTIFICATE_STATUS_EXPIRING_SOON = 8;
}

// Request to list issued certificates
message ListIssuedCertificatesRequest {
  optional IssuedCertificateStatus status = 1 [json_name = "status"];
  optional string issuer_name = 2 [json_name = "issuerName"];
  optional bool auto_renew_enabled = 3 [json_name = "autoRenewEnabled"];
  optional uint32 page = 4 [json_name = "page"];
  optional uint32 page_size = 5 [json_name = "pageSize"];
}

// Response for listing issued certificates
message ListIssuedCertificatesResponse {
  repeated IssuedCertificateInfo certificates = 1 [json_name = "certificates"];
  uint32 total = 2 [json_name = "total"];
}

// Request to get a single issued certificate
message GetIssuedCertificateRequest {
  string id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 36
      pattern: "^[a-fA-F0-9\\-]+$"
    }
  ];
  // Whether to include the private key in the response
  optional bool include_private_key = 2 [json_name = "includePrivateKey"];
}

// Response for getting a single issued certificate
message GetIssuedCertificateResponse {
  IssuedCertificateInfo certificate = 1 [json_name = "certificate"];

  // Certificate PEM data (only present for issued certificates)
  optional string certificate_pem = 2 [json_name = "certificatePem", (redact.v3.value).string = ""];
  optional string ca_certificate_pem = 3 [json_name = "caCertificatePem", (redact.v3.value).string = ""];
  // Private key PEM (only if include_private_key=true and server-generated)
  optional string private_key_pem = 4 [json_name = "privateKeyPem", (redact.v3.value).string = ""];
  optional bool server_generated_key = 5 [json_name = "serverGeneratedKey"];
}

// Issued certificate info
message IssuedCertificateInfo {
  string id = 1 [json_name = "id"];
  string common_name = 2 [json_name = "commonName"];
  repeated string domains = 3 [json_name = "domains"];
  string issuer_name = 4 [json_name = "issuerName"];
  string issuer_type = 5 [json_name = "issuerType"];
  IssuedCertificateStatus status = 6 [json_name = "status"];
  optional google.protobuf.Timestamp expires_at = 7 [json_name = "expiresAt"];
  bool auto_renew_enabled = 8 [json_name = "autoRenewEnabled"];
  int32 auto_renew_days_before_expiry = 9 [json_name = "autoRenewDaysBeforeExpiry"];
  string key_type = 10 [json_name = "keyType"];
  int32 key_size = 11 [json_name = "keySize"];
  optional string error_message = 12 [json_name = "errorMessage"];
  google.protobuf.Timestamp created_at = 13 [json_name = "createdAt"];
  google.protobuf.Timestamp updated_at = 14 [json_name = "updatedAt"];
  // NotBefore from the actual X.509 cert. Truth source for "when was
  // this cert issued" — created_at only reflects when the DB row was
  // first inserted and does not change across renewals.
  optional google.protobuf.Timestamp last_issued_at = 15 [json_name = "lastIssuedAt"];
  // Timestamp of the most recent renewal attempt (success or failure).
  // Compare against last_issued_at to detect "renewal ran but didn't
  // actually issue a new cert" — those should never diverge if the
  // renewal scheduler is healthy.
  optional google.protobuf.Timestamp last_renewal_at = 16 [json_name = "lastRenewalAt"];
}

// Request to force renew an issued certificate
message ForceRenewCertificateRequest {
  string id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 36
      pattern: "^[a-fA-F0-9\\-]+$"
    }
  ];
}

// Response for force renewing an issued certificate
message ForceRenewCertificateResponse {
  string renewal_id = 1 [json_name = "renewalId"];
  string message = 2 [json_name = "message"];
}

// Request to update an issued certificate
message UpdateIssuedCertificateRequest {
  string id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 36
      pattern: "^[a-fA-F0-9\\-]+$"
    }
  ];
  // Enable or disable auto-renewal
  optional bool auto_renew_enabled = 2 [json_name = "autoRenewEnabled"];
  // Number of days before expiry to trigger renewal
  optional int32 auto_renew_days_before_expiry = 3 [
    json_name = "autoRenewDaysBeforeExpiry",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 90
    }
  ];
}

// Response for updating an issued certificate
message UpdateIssuedCertificateResponse {
  IssuedCertificateInfo certificate = 1 [json_name = "certificate"];
}

// Request to deploy a certificate
message DeployCertificateRequest {
  string id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 36
      pattern: "^[a-fA-F0-9\\-]+$"
    }
  ];
  // Deploy to a target group (creates parent + child jobs)
  optional string deployment_target_id = 2 [json_name = "deploymentTargetId"];
  // Deploy to a single target configuration
  optional string target_configuration_id = 3 [json_name = "targetConfigurationId"];
}

// Response for deploying a certificate
message DeployCertificateResponse {
  string job_id = 1 [json_name = "jobId"];
  string message = 2 [json_name = "message"];
}

// Request to list deployment targets
message ListDeploymentTargetsRequest {}

// Deployment target info
message DeploymentTargetInfo {
  string id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string description = 3 [json_name = "description"];
  int32 configuration_count = 4 [json_name = "configurationCount"];
}

// Response for listing deployment targets
message ListDeploymentTargetsResponse {
  repeated DeploymentTargetInfo targets = 1 [json_name = "targets"];
}
